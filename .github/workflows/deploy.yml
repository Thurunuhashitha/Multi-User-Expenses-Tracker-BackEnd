      - name: Deploy to EC2 and Restart PM2
        shell: bash
        run: |
          set -e

          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes ubuntu@123.45.67.89 << EOF
            set -e
            echo "🚀 Starting deployment..."

            # Load nvm
            export NVM_DIR="\$HOME/.nvm"
            if [ -s "\$NVM_DIR/nvm.sh" ]; then
              . "\$NVM_DIR/nvm.sh"
              nvm use --lts >/dev/null 2>&1 || true
            fi

            echo "Node: \$(command -v node || echo 'not found')"
            echo "NPM:  \$(command -v npm  || echo 'not found')"

            cd /home/ubuntu/backend/Multi-User-Expenses-Tracker-BackEnd

            echo "📥 Pulling latest code..."
            git fetch --all
            git reset --hard origin/main

            echo "📦 Installing dependencies..."
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi

            echo "🏗 Building project..."
            npm run build --if-present

            echo "🔁 Restarting PM2 process..."
            pm2 reload index --update-env || pm2 restart index --update-env
            pm2 save

            echo "✅ Deployment complete!"
          EOF

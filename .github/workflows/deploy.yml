name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up SSH
      - name: Setup SSH
        shell: bash
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Add private key from secrets
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Add known host key from secrets
          echo "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Step 3: Test SSH connectivity
      - name: Test SSH connection
        shell: bash
        run: |
          set -e
          echo "Testing SSH connection..."
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes ubuntu@13.233.108.0 "echo SSH connection OK"

      # Step 4: Deploy code and restart PM2
      - name: Deploy to EC2 and Restart PM2
        shell: bash
        run: |
          set -e

          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes ubuntu@13.233.108.0 << EOF
            set -e
            echo "🚀 Starting deployment..."

            # Load NVM (Node Version Manager)
            export NVM_DIR="\$HOME/.nvm"
            if [ -s "\$NVM_DIR/nvm.sh" ]; then
              . "\$NVM_DIR/nvm.sh"
              nvm use --lts >/dev/null 2>&1 || true
            fi

            echo "Node: \$(command -v node || echo 'not found')"
            echo "NPM:  \$(command -v npm  || echo 'not found')"

            cd /home/ubuntu/backend/Multi-User-Expenses-Tracker-BackEnd

            echo "📥 Pulling latest code..."
            git fetch --all
            git reset --hard origin/main

            echo "📦 Installing dependencies..."
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi

            echo "🏗 Building project..."
            npm run build --if-present

            echo "🔁 Restarting PM2 process..."
            pm2 reload index --update-env || pm2 restart index --update-env
            pm2 save

            echo "✅ Deployment complete!"
          EOF
